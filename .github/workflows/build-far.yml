name: build-far

# Rebuilds the AnalogSense full analog report on top of Keychron's latest
# 2025q3 tip and publishes the binaries as a release.
#
# This branch (far-ci) holds only this workflow. The actual port lives as a
# single commit on keychron-far-2025q3, which is kept clean so it stays
# PR-able against AnalogSense. Each run cherry-picks that commit onto the
# current upstream tip, so there is no base ref to keep pinned.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only build the first N targets (0 = all). Use a small N to test workflow changes without a full build."
        required: false
        default: "0"

permissions:
  contents: write

env:
  PORT_BRANCH: keychron-far-2025q3
  UPSTREAM_REPO: https://github.com/Keychron/qmk_firmware
  UPSTREAM_BRANCH: 2025q3

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick the port onto the upstream tip
        id: port
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The build tree below is upstream's, which does not contain this
          # branch's files, so keep what later steps need outside the worktree.
          cp .github/release_notes.py /tmp/release_notes.py

          git remote add keychron "$UPSTREAM_REPO"
          git fetch --no-tags keychron "$UPSTREAM_BRANCH"
          git fetch --no-tags origin "$PORT_BRANCH"
          git fetch --tags origin

          # Tag is keyed on the upstream commit alone (no date), so a run where
          # Keychron has not moved is a no-op instead of a duplicate release.
          UPSTREAM_SHA=$(git rev-parse --short "keychron/$UPSTREAM_BRANCH")
          TAG="far-$UPSTREAM_SHA"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Already released $TAG; upstream has not moved. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          PORT_COMMIT=$(git rev-parse "origin/$PORT_BRANCH")
          git checkout -B build "keychron/$UPSTREAM_BRANCH"

          # Fails loudly if upstream refactors the code the port touches;
          # that needs a human to redo the port on keychron-far-2025q3.
          git cherry-pick "$PORT_COMMIT"

          {
            echo "upstream_sha=$(git rev-parse --short keychron/$UPSTREAM_BRANCH)"
            echo "build_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch submodules
        if: steps.port.outputs.skip == 'false'
        run: make git-submodule

      - name: Collect analog-switch targets
        if: steps.port.outputs.skip == 'false'
        id: targets
        run: |
          set -euo pipefail
          # Discovered per run, so HE boards Keychron adds later are picked up.
          for kb in $(grep -rl analog_matrix.mk keyboards --include=rules.mk | xargs -n1 dirname); do
            find "$kb" -name keyboard.json -printf '%h\n'
          done | sed 's|^keyboards/||' | sort -u > targets.txt

          LIMIT="${{ github.event.inputs.limit || '0' }}"
          if [ "$LIMIT" != "0" ]; then
            head -n "$LIMIT" targets.txt > targets.trimmed && mv targets.trimmed targets.txt
            echo "Test run: limited to $LIMIT target(s)."
          fi

          echo "Found $(wc -l < targets.txt) targets:"
          cat targets.txt
          echo "count=$(wc -l < targets.txt)" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.port.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while read -r kb; do
            # Vendor keymap: keychron/... -> keychron, lemokey/... -> lemokey.
            km="${kb%%/*}"
            echo "::group::$kb ($km)"
            qmk compile -kb "$kb" -km "$km" -e ALLOW_WARNINGS=yes -j "$(nproc)"
            echo "::endgroup::"
          done < targets.txt
          mv ./*.bin artifacts/
          ls -la artifacts

      - name: Write release notes
        if: steps.port.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python3 /tmp/release_notes.py \
            --targets targets.txt \
            --artifacts artifacts \
            --upstream-sha "${{ steps.port.outputs.upstream_sha }}" \
            --build-sha "${{ steps.port.outputs.build_sha }}" \
            > notes.md
          cat notes.md

      - name: Push the built commit
        if: steps.port.outputs.skip == 'false' && (github.event.inputs.limit || '0') == '0'
        run: |
          set -euo pipefail
          # QMK is GPL-2.0, so the exact source for these binaries has to stay
          # available. Tagging the commit that was built is what provides it.
          git tag -a "${{ steps.port.outputs.tag }}" \
            -m "Built against Keychron $UPSTREAM_BRANCH @ ${{ steps.port.outputs.upstream_sha }}"
          git push origin "${{ steps.port.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        if: steps.port.outputs.skip == 'false' && (github.event.inputs.limit || '0') == '0'
        with:
          tag_name: ${{ steps.port.outputs.tag }}
          name: "Keychron ${{ env.UPSTREAM_BRANCH }} @ ${{ steps.port.outputs.upstream_sha }} +far"
          body_path: notes.md
          files: artifacts/*.bin
